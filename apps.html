<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spark AI Apps</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f0ff;
      text-align: center;
      padding: 30px 15px;
    }
    h1 { color: #6c3fc5; }
    .apps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 15px;
      max-width: 650px;
      margin: 25px auto;
    }
    a {
      background: white;
      padding: 25px 10px;
      border-radius: 15px;
      text-decoration: none;
      color: #432776;
      font-weight: bold;
      box-shadow: 0 3px 12px #ddd;
    }
    a:hover { background: #e8dcff; }
  </style>
</head>
<body>
  <h1>Spark AI Apps ✨</h1>
  <p>Choose an app to open</p>

  <div class="apps">
    <a href="https://web.general knowledge quizzes.com/" target="_blank">general knowledge quizzes</a>
    <a href="https://web.whatsapp.com/" target="_blank">WhatsApp</a>
    <a href="https://www.google.com/" target="_blank">Google</a>
    <a href="https://www.youtube.com/" target="_blank">YouTube</a>
    <a href="https://www.instagram.com/" target="_blank">Instagram</a>
   
  </div>
</body>
</html>
